{{- if .Values.ingressCutover.enabled -}}
{{- $fullName := .Chart.Name -}}
{{- $svcPort := .Values.service.port -}}
{{- $clusterHostname := .Values.clusterHostname -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingressCutover.nameOverride | default (printf "%s-ingress-cutover" $fullName) | quote }}
  labels:
    {{- include "seqr.labels" . | nindent 4 }}
  {{- with .Values.ingressCutover.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingressCutover.className }}
  ingressClassName: {{ .Values.ingressCutover.className }}
  {{- end }}
  {{- if .Values.ingressCutover.tls }}
  tls:
    {{- range .Values.ingressCutover.tls }}
    - hosts:
        - {{ $clusterHostname | quote }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingressCutover.hosts }}
    - host: {{ $clusterHostname | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .serviceName | default $fullName }}
                port:
                  number: {{ .servicePort | default $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}

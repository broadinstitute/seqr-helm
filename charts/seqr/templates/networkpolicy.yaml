{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-only-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: {{ .Chart.Name }}
      {{- if (.Values.ingress.namespaceLabel | default .Values.ingress.nameOverride) }}
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.ingress.namespaceLabel | default .Values.ingress.nameOverride }}
      {{- end }}
      {{- range .Values.ingress.backendConfig.allowedIngressCidrs }}
      - ipBlock:
          cidr: {{ . }}
      {{- end }}
{{- end }}